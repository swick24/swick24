<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        // Extract the path from the current URL
        const path = window.location.pathname;
        
        // Check if the URL starts with /game/
        if (path.startsWith('/game/')) {
            // Extract the game name (everything after /game/)
            const gameName = path.substring(6); // 6 is the length of "/game/"
            
            // Redirect to the game page with the game name as a query parameter
            window.location.href = '/game/?game=' + gameName;
        } else {
            // For all other 404s, redirect to the homepage
            window.location.href = '/';
        }
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
