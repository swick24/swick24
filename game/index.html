<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swick Game Redirect</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
            color: #333;
        }
        .loading {
            margin-bottom: 30px;
        }
        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
        }
        h1 {
            margin-bottom: 10px;
        }
        p {
            margin-bottom: 20px;
            max-width: 500px;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #38a169;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        .store-button {
            background-color: #38a169;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            transition: background-color 0.2s;
        }
        .store-button:hover {
            background-color: #2f855a;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#38a169">
            <path d="M13 18.94V21h-2v-2.06c-4.17-.46-7.48-3.71-8-7.94H5V9h12v2h2c-.52 4.23-3.83 7.48-8 7.94zM12 14c-1.86 0-3.41-1.28-3.86-3H15.86c-.45 1.72-2 3-3.86 3z" />
            <path d="M10.32 5.36l-1.09-1.09C10.17 3.08 11.04 2.5 12 2.5c.96 0 1.83.58 2.77 1.77l-1.09 1.09C13.16 4.8 12.57 4.5 12 4.5c-.57 0-1.16.3-1.68.86z" />
        </svg>
    </div>
    <h1>Swick Game</h1>
    <div class="loading">
        <p id="message">Loading your game...</p>
        <div class="spinner"></div>
    </div>
    <a href="https://play.google.com/store/apps/details?id=com.main.swick" class="store-button">
        Open Swick App
    </a>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            try {
                // Get the game name from the URL path
                let pathSegments = window.location.pathname.split('/');
                let gameName = '';
                
                // The URL format is /game/game_name
                // So we check if there's something after /game/
                if (pathSegments.length >= 3 && pathSegments[1] === 'game') {
                    gameName = pathSegments[2];
                }
                
                if (gameName) {
                    // Convert from URL format (snake_case) to display format (Title Case)
                    let displayName = gameName
                        .split('_')
                        .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                        .join(' ');
                    
                    document.getElementById('message').textContent = 
                        `Opening "${displayName}" in the Swick app...`;
                    
                    // Check if we're on a mobile device
                    let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                    
                    if (isMobile) {
                        // Try to open the app with the deep link
                        let deepLink = `swick://game/${gameName}`;
                        window.location.href = deepLink;
                        
                        // If the app doesn't open after a delay, redirect to the store
                        setTimeout(function() {
                            document.getElementById('message').textContent = 
                                "Couldn't open the app. Please install Swick from the store.";
                        }, 2000);
                    } else {
                        // On desktop, just show a message
                        document.getElementById('message').textContent = 
                            "Please open this link on your mobile device or scan the QR code.";
                    }
                } else {
                    document.getElementById('message').textContent = 
                        "No game specified. Please check your link.";
                }
            } catch (e) {
                document.getElementById('message').textContent = 
                    "An error occurred. Please try again later.";
                console.error(e);
            }
        });
    </script>
</body>
</html>
