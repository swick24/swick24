<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Opening Game...</title>
  <script>
    window.onload = function () {
      const path = window.location.pathname;
      const segments = path.split('/');
      const gameSlug = segments.length > 2 ? segments[2] : null;

      if (!gameSlug) {
        document.body.innerHTML = "<p>Invalid game link.</p>";
        return;
      }

      const appLink = `swick://game/${gameSlug}`;
      const playStoreLink = "https://play.google.com/store/apps/details?id=com.main.swick`;

      const now = Date.now();
      setTimeout(() => {
        if (Date.now() - now < 2000) {
          window.location.href = playStoreLink;
        }
      }, 1500);

      window.location.href = appLink;
    };
  </script>
</head>
<body>
  <p>Opening game in app...</p>
</body>
</html>
